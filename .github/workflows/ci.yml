name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile server.py

      - name: Check application
        run: |
          python3 -m py_compile server.py
          echo "Python syntax check passed"

